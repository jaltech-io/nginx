# =============================================================================
# fo.projectflow.profeskills.com — application ProjectFlow (front office) : front + BFF
# Meme domaine pour API et frontend = cookies HTTP-only fonctionnels
# Remplace admin.profeskills.com (2026-10-09), qui redirige ici (admin.conf).
# DNS : couvert par le wildcard *.profeskills.com -> VM.
# Certificat : bloc « domaines produit » de ansible/tasks-nginx.yml.
# =============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name fo.projectflow.profeskills.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name fo.projectflow.profeskills.com;

    ssl_certificate     /etc/letsencrypt/live/fo.projectflow.profeskills.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fo.projectflow.profeskills.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Resolution DNS dynamique (docker) — un nom d'hote statique dans proxy_pass
    # n'est resolu qu'une fois au demarrage/reload de nginx et reste en cache
    # pour toute la duree de vie du process, meme si le conteneur cible est
    # recree avec une nouvelle IP (ex: redeploiement de l'API seule). Passer
    # par une variable force nginx a re-resoudre via le "resolver" defini dans
    # nginx.conf (127.0.0.11, valid=30s) a chaque nouvelle connexion.

    # API + Auth → NestJS (BFF pattern : meme domaine = cookies OK)
    location ~ ^/(auth|api)/ {
        set $admin_api pf-admin_api-app;
        proxy_pass http://$admin_api:3000;
        include    /etc/nginx/conf.d/proxy_params.inc;
    }

    # Frontend → Vue3 container (SPA, fallback index.html gere par pf-admin_front-app)
    location / {
        set $admin_front pf-admin_front-app;
        proxy_pass http://$admin_front:80;
        include    /etc/nginx/conf.d/proxy_params.inc;
    }
}
