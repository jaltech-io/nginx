# =============================================================================
# forge.profeskills.com — la FORGE (Forgejo), microservice git de ProjectFlow
# UI déléguée au service (décision produit — docs/VISION.md de projectflow) :
# ProjectFlow y envoie via son lanceur d'applications et ses liens ticket↔code.
# =============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name forge.profeskills.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name forge.profeskills.com;

    ssl_certificate     /etc/letsencrypt/live/forge.profeskills.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forge.profeskills.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # git push/pull HTTP transporte de gros packs, et le REGISTRY de conteneurs
    # integre (docker push) envoie des layers de plusieurs GB en une requete —
    # pas de limite ici (endpoint authentifie, prive).
    client_max_body_size 0;

    location / {
        # Resolution DNS dynamique (docker) — voir admin.conf pour la raison.
        set $forge forge;
        proxy_pass http://$forge:3000;
        include    /etc/nginx/conf.d/proxy_params.inc;
    }
}
