# =============================================================================
# projectflow.profeskills.com — Landing (vitrine) de ProjectFlow
# Servie par le conteneur `pf-landing-app` (nginx statique sur platform-net).
# Remplace profeskills.com (2026-10-09), qui redirige ici (profeskills.conf).
# DNS : couvert par le wildcard *.profeskills.com -> VM.
# Certificat : bloc « domaines produit » de ansible/tasks-nginx.yml.
# =============================================================================

# HTTP → HTTPS + challenge ACME
server {
    listen 80;
    server_name projectflow.profeskills.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS → conteneur pf-landing-app
server {
    listen 443 ssl;
    server_name projectflow.profeskills.com;

    ssl_certificate     /etc/letsencrypt/live/projectflow.profeskills.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projectflow.profeskills.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Resolution DNS dynamique (docker) — voir fo-projectflow.conf.
    location / {
        set $landing_backend pf-landing-app;
        proxy_pass http://$landing_backend:80;
        include    /etc/nginx/conf.d/proxy_params.inc;
    }
}
