# =============================================================================
# Serveur par DÉFAUT : tout nom qui n'a pas son vhost (ex. admin.profeskills.com,
# supprimé le 2026-10-09) est refusé au lieu de retomber sur le premier vhost venu.
# Port 80 : seul le challenge ACME répond (certbot --webroot pour un nouveau nom,
# avant que son vhost n'existe). Préfixe 00- : chargé en premier.
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
