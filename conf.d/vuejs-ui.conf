# =============================================================================
# vuejs-ui.profeskills.com — Vitrine des composants @jaltech/vuejs-ui
# Site statique VitePress (repo vuejs-libs, apps/docs) servi par le conteneur
# `vuejs-ui-docs` (nginx:alpine) sur platform-net.
#
# Le conteneur backing est lance a la main (pas encore dans un compose/ansible) :
#   aws s3 sync s3://<backups-bucket>/vuejs-ui-docs/site/ /opt/vuejs-ui-docs/site --delete
#   docker run -d --name vuejs-ui-docs --restart unless-stopped --network platform-net \
#     -v /opt/vuejs-ui-docs/site:/usr/share/nginx/html:ro \
#     -v /opt/vuejs-ui-docs/default.conf:/etc/nginx/conf.d/default.conf:ro \
#     nginx:1.27-alpine
# (default.conf du conteneur : try_files $uri $uri.html $uri/ =404 pour les clean URLs VitePress.)
# Certificat : certbot --webroot -w /var/www/certbot -d vuejs-ui.profeskills.com.
# DNS : couvert par le wildcard *.profeskills.com -> VM.
# =============================================================================

# HTTP → HTTPS + challenge ACME
server {
    listen 80;
    server_name vuejs-ui.profeskills.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS → conteneur statique vuejs-ui-docs
server {
    listen 443 ssl;
    server_name vuejs-ui.profeskills.com;

    ssl_certificate     /etc/letsencrypt/live/vuejs-ui.profeskills.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vuejs-ui.profeskills.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Resolution DNS dynamique (docker) — variable + resolver pour re-resoudre
    # l'IP du conteneur apres un redeploiement (voir admin.conf/keycloak.conf).
    location / {
        set $vuejs_docs vuejs-ui-docs;
        proxy_pass http://$vuejs_docs:80;
        include    /etc/nginx/conf.d/proxy_params.inc;
    }
}
