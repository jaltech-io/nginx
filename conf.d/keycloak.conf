# Vhost Keycloak — AUTH_DOMAIN remplace par le domaine reel
# Gere par Ansible (certbot) — ne pas modifier manuellement

server {
    listen 80;
    server_name AUTH_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name AUTH_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/AUTH_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/AUTH_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"  always;
    add_header X-Content-Type-Options     "nosniff"     always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection           "1; mode=block" always;

    # burst releve 50 → 500 : le seed de ProjectFlow (provisioning Authorization
    # Services — centaines d'appels admin sequentiels depuis la VM elle-meme via
    # cette URL publique) depassait le burst et recevait des 503 en rafale
    # (constate au deploiement du 2026-08-23). Le rate reste 30r/s, la zone
    # login (anti brute-force, 5r/m) n'est pas touchee.
    limit_req zone=platform_global burst=500 nodelay;

    # Resolution DNS dynamique (docker) — un nom d'hote statique (ou un bloc
    # upstream classique) n'est resolu qu'une fois au demarrage/reload de nginx
    # et reste en cache pour toute la duree de vie du process, meme si le
    # conteneur cible est recree avec une nouvelle IP (ex: redeploiement de
    # Keycloak seul). Passer par une variable force nginx a re-resoudre via le
    # "resolver" defini dans nginx.conf (127.0.0.11, valid=30s) a chaque
    # nouvelle connexion — meme pattern que admin.conf, applique ici apres
    # avoir ete touche par le bug qu'il decrit (502 apres un redeploiement de
    # keycloak, l'upstream statique pointait encore sur l'ancien conteneur).

    location /admin {
        set $keycloak_backend keycloak;
        proxy_pass         http://$keycloak_backend:8080;
        include            /etc/nginx/conf.d/proxy_params.inc;
    }

    location ~* ^/realms/[^/]+/(protocol/openid-connect/token|login-actions) {
        limit_req zone=platform_login burst=10 nodelay;
        limit_req_status 429;
        set $keycloak_backend keycloak;
        proxy_pass http://$keycloak_backend:8080;
        include    /etc/nginx/conf.d/proxy_params.inc;
    }

    location /health {
        set $keycloak_backend keycloak;
        proxy_pass http://$keycloak_backend:9000/health;
        access_log off;
    }

    location / {
        set $keycloak_backend keycloak;
        proxy_pass http://$keycloak_backend:8080;
        include    /etc/nginx/conf.d/proxy_params.inc;
    }
}
