# =============================================================================
# profeskills.com — Landing (vitrine)
# Apex servi par le conteneur `pf-landing-app` (nginx statique sur platform-net).
# www -> redirige vers l'apex. Certificat SAN : profeskills.com + www.
# Le certificat est obtenu par le role Ansible nginx (certbot standalone)
# AVANT le demarrage de nginx -> ce vhost ne casse pas si on respecte ce flux.
# =============================================================================

# HTTP → HTTPS (apex + www) + challenge ACME
server {
    listen 80;
    server_name profeskills.com www.profeskills.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://profeskills.com$request_uri;
    }
}

# HTTPS www → apex
server {
    listen 443 ssl;
    server_name www.profeskills.com;

    ssl_certificate     /etc/letsencrypt/live/profeskills.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/profeskills.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://profeskills.com$request_uri;
}

# HTTPS apex → conteneur pf-landing-app
server {
    listen 443 ssl;
    server_name profeskills.com;

    ssl_certificate     /etc/letsencrypt/live/profeskills.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/profeskills.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Resolution DNS dynamique (docker) — voir admin.conf/keycloak.conf pour le
    # detail : un nom d'hote statique dans proxy_pass reste en cache pour toute
    # la duree de vie du process nginx, meme apres un redeploiement de ce
    # conteneur.
    location / {
        set $landing_backend pf-landing-app;
        proxy_pass http://$landing_backend:80;
        include    /etc/nginx/conf.d/proxy_params.inc;
    }
}
