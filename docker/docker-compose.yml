# =============================================================================
# nginx — Reverse proxy platform (Phase 2 EC2)
#
# Gere tous les vhosts de la VM :
#   conf.d/keycloak.conf  → https://auth.domaine.com
#   conf.d/<app>.conf     → https://<app>.domaine.com  (futures apps)
#
# Reseau platform-net cree ici — rejoint par chaque app (keycloak, openfga...)
# =============================================================================

name: nginx-platform

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    # Garde-fous (bonne pratique, quelle que soit la VM) : plafond memoire, nginx epargne en cas de
    # manque de memoire (porte d'entree de tous les services), rotation des journaux.
    mem_limit: 128m
    oom_score_adj: -500
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  platform-net:
    name: platform-net
    driver: bridge
