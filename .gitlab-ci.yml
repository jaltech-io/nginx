# =============================================================================
# nginx — Reverse proxy platform (repo standalone, ex platform-apps/deploy/nginx)
#
# STAGES : lint | deploy
#
# PATH : lint:nginx (auto) → deploy:nginx ▶ → deploy:nginx:reload ▶
#
# Les jobs deploy sont MANUELS : ils touchent la VM EC2 en service (S3 sync +
# SSM ansible). Rien ne part vers la VM sans declenchement explicite.
#
# Variables GitLab CI/CD requises :
#   AWS_ROLE_ARN — ARN du role IAM OIDC (assume-role-with-web-identity)
#   AWS_REGION   — surchargeable, defaut eu-west-1 ci-dessous
# =============================================================================

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - when: never

stages:
  - lint
  - deploy

variables:
  AWS_REGION:     "eu-west-1"
  DOMAIN_NAME:    "auth.profeskills.com"
  ADMIN_DOMAIN:   "admin.profeskills.com"
  LANDING_DOMAIN: "profeskills.com"
  FORGE_DOMAIN:   "forge.profeskills.com"

# =============================================================================
# BLOCS REUTILISABLES
# =============================================================================

.oidc_auth:
  script:
    - |
      CREDS=$(aws sts assume-role-with-web-identity \
        --role-arn           "${AWS_ROLE_ARN}" \
        --role-session-name  "gitlab-$(echo ${CI_JOB_NAME} | tr ':' '-')-${CI_JOB_ID}" \
        --web-identity-token "${GITLAB_OIDC_TOKEN}" \
        --duration-seconds   3600 \
        --output json)
      export AWS_ACCESS_KEY_ID=$(echo "${CREDS}"     | jq -r '.Credentials.AccessKeyId')
      export AWS_SECRET_ACCESS_KEY=$(echo "${CREDS}" | jq -r '.Credentials.SecretAccessKey')
      export AWS_SESSION_TOKEN=$(echo "${CREDS}"     | jq -r '.Credentials.SessionToken')
    - aws sts get-caller-identity

.aws_base:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apk add --no-cache --upgrade expat
    - apk add --no-cache jq git curl python3 py3-pip
    - pip3 install --quiet --break-system-packages awscli
    - !reference [.oidc_auth, script]

.ssm_run:
  script:
    - |
      CMD_ID=$(aws ssm send-command \
        --instance-ids  "${INSTANCE_ID}" \
        --document-name "AWS-RunShellScript" \
        --parameters    file:///tmp/ssm-cmd.json \
        --timeout-seconds 1800 \
        --output-s3-bucket-name "${BUCKET}" \
        --output-s3-key-prefix  "ssm-output/${CI_JOB_NAME}" \
        --region "${AWS_REGION}" \
        --query  "Command.CommandId" --output text)
      echo "✅ SSM Command: ${CMD_ID}"

      STATUS="InProgress"; ELAPSED=0
      while [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ]; do
        sleep 30; ELAPSED=$(( ELAPSED + 30 ))
        STATUS=$(aws ssm get-command-invocation \
          --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
          --region "${AWS_REGION}" --query "Status" --output text 2>/dev/null || echo "Unknown")
        echo "⏳ [${ELAPSED}s] ${STATUS}"
        [ "$ELAPSED" -ge 1800 ] && break
      done

      echo "════════════════════════════════════════════════════"
      echo "  OUTPUT — ${CI_JOB_NAME}"
      echo "════════════════════════════════════════════════════"
      S3_OUT="ssm-output/${CI_JOB_NAME}/${CMD_ID}/${INSTANCE_ID}/awsrunShellScript/0.awsrunShellScript/stdout"
      aws s3 cp "s3://${BUCKET}/${S3_OUT}" - 2>/dev/null \
        || aws ssm get-command-invocation \
             --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
             --region "${AWS_REGION}" --query "StandardOutputContent" --output text 2>/dev/null \
        || echo "(output non disponible)"
      echo "════════════════════════════════════════════════════"

      [ "$STATUS" != "Success" ] && \
        aws ssm get-command-invocation --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
          --region "${AWS_REGION}" --query "StandardErrorContent" --output text 2>/dev/null && \
        echo "❌ Echec (${STATUS})" && exit 1
      echo "✅ Succes"

.ssm_wait:
  script:
    - |
      echo "⏳ Attente SSM Online..."
      MAX=40; TRIED=0; SSM_STATUS="None"
      while [ "$TRIED" -lt "$MAX" ]; do
        SSM_STATUS=$(aws ssm describe-instance-information \
          --filters "Key=InstanceIds,Values=${INSTANCE_ID}" --region "${AWS_REGION}" \
          --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || echo "None")
        [ "$SSM_STATUS" = "Online" ] && echo "✅ SSM Online" && break
        echo "  [$(( TRIED * 15 ))s] ${SSM_STATUS}..."
        sleep 15; TRIED=$(( TRIED + 1 ))
      done
      [ "$SSM_STATUS" != "Online" ] && echo "❌ Timeout SSM" && exit 1

# =============================================================================
# ██  LINT  ██
# =============================================================================

lint:nginx:
  stage: lint
  image: nginx:1.27-alpine
  script:
    - test -f nginx.conf
    - test -f conf.d/keycloak.conf
    - test -f conf.d/profeskills.conf
    - test -f conf.d/proxy_params.inc
    - test -f docker/docker-compose.yml
    - mkdir -p /tmp/nginx-check
    - cp -r nginx.conf conf.d docker ansible /tmp/nginx-check/
    - sed -i 's/AUTH_DOMAIN/localhost/g' /tmp/nginx-check/conf.d/keycloak.conf
    - sed -i '/ssl_certificate/d'     /tmp/nginx-check/conf.d/keycloak.conf
    - sed -i '/ssl_certificate_key/d' /tmp/nginx-check/conf.d/keycloak.conf
    - nginx -t -c /tmp/nginx-check/nginx.conf 2>&1 || true
    - echo "✅ nginx lint OK"
  rules:
    - when: on_success

# =============================================================================
# ██  DEPLOY  ██ — MANUEL uniquement (VM en service)
# =============================================================================
# sync configs S3 + ansible (nginx + SSL) — suppose Docker installe par vm-aws

deploy:nginx:
  extends: .aws_base
  stage: deploy
  needs: ["lint:nginx"]
  script:
    - |
      INSTANCE_ID=$(aws ec2 describe-instances \
        --filters "Name=tag:Project,Values=platform" "Name=instance-state-name,Values=running" \
        --query "Reservations[0].Instances[0].InstanceId" \
        --output text --region "${AWS_REGION}")
      [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ] && \
        echo "❌ Pas d'EC2 — provisionner via le repo vm-aws d'abord" && exit 1

      BUCKET="platform-prod-backups-$(aws sts get-caller-identity --query Account --output text)"

      echo "→ Instance : ${INSTANCE_ID} | Bucket : ${BUCKET} | Domain : ${DOMAIN_NAME}"

      aws s3 sync . "s3://${BUCKET}/nginx/" --region "${AWS_REGION}" --delete \
        --exclude ".git/*" --exclude ".gitlab-ci.yml" --exclude "README.md"
      aws s3 sync ansible/ "s3://${BUCKET}/nginx-ansible/" --region "${AWS_REGION}" --delete
      echo "✅ Configs nginx synced"

      jq -n \
        --arg domain "${DOMAIN_NAME}" \
        --arg admindomain "${ADMIN_DOMAIN}" \
        --arg landingdomain "${LANDING_DOMAIN}" \
        --arg forgedomain "${FORGE_DOMAIN}" \
        --arg region "${AWS_REGION}" \
        --arg bucket "${BUCKET}" \
        '{domain_name:$domain,admin_domain:$admindomain,landing_domain:$landingdomain,forge_domain:$forgedomain,aws_region:$region,backups_bucket:$bucket}' \
        > /tmp/nginx-vars.json
      aws s3 cp /tmp/nginx-vars.json "s3://${BUCKET}/pipeline/nginx-vars.json" --region "${AWS_REGION}"
      rm -f /tmp/nginx-vars.json

      jq -n \
        --arg prereq "command -v ansible-playbook || pip3 install --quiet ansible" \
        --arg sync   "aws s3 sync s3://${BUCKET}/nginx-ansible/ /opt/nginx-ansible/ --region ${AWS_REGION} --delete" \
        --arg getv   "aws s3 cp s3://${BUCKET}/pipeline/nginx-vars.json /tmp/nginx-vars.json --region ${AWS_REGION}" \
        --arg play   "cd /opt/nginx-ansible && ansible-playbook site.yml -i inventory.ini -e @/tmp/nginx-vars.json" \
        '{commands:["set -eu",$prereq,$sync,$getv,$play,"rm -f /tmp/nginx-vars.json","docker ps"]}' \
        > /tmp/ssm-cmd.json
    - !reference [.ssm_wait, script]
    - !reference [.ssm_run, script]
  rules:
    - when: manual
      allow_failure: true
  environment:
    name: nginx

deploy:nginx:reload:
  extends: .aws_base
  stage: deploy
  needs: ["lint:nginx"]
  script:
    - |
      INSTANCE_ID=$(aws ec2 describe-instances \
        --filters "Name=tag:Project,Values=platform" "Name=instance-state-name,Values=running" \
        --query "Reservations[0].Instances[0].InstanceId" \
        --output text --region "${AWS_REGION}")
      [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ] && \
        echo "❌ Pas d'EC2 actif" && exit 1

      BUCKET="platform-prod-backups-$(aws sts get-caller-identity --query Account --output text)"

      aws s3 sync . "s3://${BUCKET}/nginx/" --region "${AWS_REGION}" --delete \
        --exclude ".git/*" --exclude ".gitlab-ci.yml" --exclude "README.md"
      aws s3 sync ansible/ "s3://${BUCKET}/nginx-ansible/" --region "${AWS_REGION}" --delete
      echo "✅ Configs nginx synced"

      jq -n \
        --arg prereq "command -v ansible-playbook || pip3 install --quiet ansible" \
        --arg sync   "aws s3 sync s3://${BUCKET}/nginx-ansible/ /opt/nginx-ansible/ --region ${AWS_REGION} --delete" \
        --arg play   "cd /opt/nginx-ansible && ansible-playbook reload.yml -i inventory.ini" \
        '{commands:["set -eu",$prereq,$sync,$play,"docker ps"]}' \
        > /tmp/ssm-cmd.json
    - !reference [.ssm_wait, script]
    - !reference [.ssm_run, script]
  rules:
    - when: manual
      allow_failure: true
  environment:
    name: nginx
    action: prepare
