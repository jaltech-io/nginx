user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    client_max_body_size    10m;
    proxy_buffers           8 64k;
    proxy_buffer_size       128k;
    proxy_busy_buffers_size 128k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    # DNS resolver Docker interne — requis pour resoudre les noms de containers
    # 127.0.0.11 est le serveur DNS interne de Docker pour les reseaux user-defined
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Rate limiting — zones partagees entre toutes les apps
    limit_req_zone $binary_remote_addr zone=platform_global:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=platform_login:10m  rate=5r/m;

    # Pas de bloc upstream ici (volontaire) — un upstream classique resout son
    # nom d'hote une seule fois au demarrage/reload et le garde en cache pour
    # toute la duree de vie du process nginx, meme si le conteneur cible est
    # recree avec une nouvelle IP. Chaque vhost (conf.d/*.conf) resout sa cible
    # dynamiquement via une variable + le resolver Docker ci-dessus a la place.

    # Vhosts — un fichier .conf par app dans conf.d/
    include /etc/nginx/conf.d/*.conf;
}
